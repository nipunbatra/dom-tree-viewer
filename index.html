<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Tree Viewer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>DOM Tree Viewer</h1>
            <p>Enter a URL to visualize its DOM structure</p>
        </header>

        <div class="input-section">
            <input type="url" id="urlInput" placeholder="https://example.com" value="https://nipunbatra.github.io/stt-ai-teaching/html/sample-movie-website.html" />
            <button id="fetchBtn">Fetch & Visualize</button>
        </div>

        <div class="controls">
            <label>
                <input type="checkbox" id="showAttrs" checked />
                Show Attributes
            </label>
            <label>
                <input type="checkbox" id="showText" />
                Show Text Content
            </label>
            <label>
                <input type="checkbox" id="expandAll" />
                Expand All
            </label>
        </div>

        <div id="status"></div>

        <div class="content-wrapper">
            <div class="tree-panel">
                <h2>DOM Tree <span class="hint">Click any element to select</span></h2>
                <div id="treeContainer"></div>
            </div>

            <div class="right-panel">
                <div class="stats-panel">
                    <h2>Statistics</h2>
                    <div id="statsContainer"></div>
                </div>

                <div class="bs4-panel">
                    <h2>Beautiful Soup 4 Code</h2>
                    <div class="bs4-controls">
                        <button id="copyBtn">Copy Code</button>
                    </div>
                    <pre id="bs4Code"><code>Select an element to generate Beautiful Soup code</code></pre>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
